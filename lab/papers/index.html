function cleanAcademicText(input){
 let s=String(input||'').normalize('NFKC').replace(/\r/g,'\n').replace(/\u00ad/g,'').replace(/[\t\f\v]+/g,' ');
 s=s.replace(/([A-Za-z])-\s*\n\s*([a-z])/g,'$1$2');

 const lines=s.split(/\n+/).map(x=>x.trim()).filter(Boolean);const out=[];
 for(let i=0;i<lines.length;i++){let line=lines[i];if(!out.length){out.push(line);continue}const prev=out[out.length-1];const heading=isHeadingLine(line);const prevEnd=/[。！？!?;；:：.]$/.test(prev);const chinese=/[\u3400-\u9fff]/.test(prev+line);if(!heading&&!prevEnd&&line.length<220&&prev.length<700){out[out.length-1]=prev+(chinese?'':' ')+line}else out.push(line)}
 return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function isHeadingLine(line){const s=String(line||'').trim();if(!s||s.length>120)return false;return /^(?:\d+(?:\.\d+){0,3}\s+|[一二三四五六七八九十]+[、.．]|abstract\b|摘要\b|keywords?\b|关键词\b|introduction\b|引言\b|literature review\b|文献综述\b|method(?:ology)?\b|methods?\b|研究方法\b|model\b|模型\b|data\b|数据\b|results?\b|findings?\b|结果\b|discussion\b|讨论\b|conclusions?\b|结论\b|references?\b|参考文献\b)/i.test(s)}
function sectionBetween(text,startPatterns,endPatterns){const s=text||'';let start=-1,startLen=0;for(const p of startPatterns){const m=s.match(p);if(m&&m.index!==undefined&&(start<0||m.index<start)){start=m.index;startLen=m[0].length}}if(start<0)return '';let end=s.length;const tail=s.slice(start+startLen);for(const p of endPatterns){const m=tail.match(p);if(m&&m.index!==undefined)end=Math.min(end,start+startLen+m.index)}return cleanAcademicText(s.slice(start+startLen,end)).slice(0,3500).trim()}
function deriveStructure(rawText,x={}){
 const text=cleanAcademicText(rawText);const lines=text.split('\n').filter(Boolean);const headings=[];for(const line of lines){if(isHeadingLine(line)&&!headings.includes(line)){headings.push(line);if(headings.length>=28)break}}
 let title=x.title||'';if((!title||title===cleanTitle(x.name||''))&&lines.length){const cand=lines.slice(0,8).filter(l=>l.length>8&&l.length<240&&!/^(abstract|摘要|keywords?|关键词)/i.test(l));if(cand[0])title=cand[0]}
 const abstract=sectionBetween(text,[/(?:^|\n)\s*(?:abstract|摘要)\s*[:：]?\s*/i],[/\n\s*(?:keywords?|关键词|1\.?\s*introduction|introduction|引言)\b/i])||x.abstract||'';
 const intro=sectionBetween(text,[/\n\s*(?:1(?:\.0)?[ .、]?\s*)?(?:introduction|引言)\s*/i],[/\n\s*(?:2(?:\.0)?[ .、]?\s*)?(?:literature|related work|method|methodology|文献综述|相关工作|研究方法|方法)\b/i]);
 const method=sectionBetween(text,[/\n\s*(?:\d+(?:\.\d+)?[ .、]?\s*)?(?:methodology|methods?|research method|研究方法|方法|model|模型)\s*/i],[/\n\s*(?:\d+(?:\.\d+)?[ .、]?\s*)?(?:results?|findings?|experiment|case study|结果|实证|实验|案例)\b/i]);
 const results=sectionBetween(text,[/\n\s*(?:\d+(?:\.\d+)?[ .、]?\s*)?(?:results?|findings?|experiment(?:al results?)?|结果|研究结果|实证结果)\s*/i],[/\n\s*(?:\d+(?:\.\d+)?[ .、]?\s*)?(?:discussion|conclusions?|讨论|结论)\b/i]);
 const conclusion=sectionBetween(text,[/\n\s*(?:\d+(?:\.\d+)?[ .、]?\s*)?(?:conclusions?|concluding remarks|结论|结语)\s*/i],[/\n\s*(?:references?|参考文献|acknowledg)/i]);
 const keywords=(()=>{const m=text.match(/(?:keywords?|关键词)\s*[:：]?\s*([^\n]{2,400})/i);return m?m[1].split(/[,，;；·|]/).map(x=>x.trim()).filter(Boolean).slice(0,12):[]})();
 return {text,title,abstract,overview:intro.slice(0,2200),method:method.slice(0,2200),results:results.slice(0,2200),conclusion:conclusion.slice(0,2200),headings,keywords};
}
function mergeDerived(x,d){if(!d)return x._derived||{};x._derived={...(x._derived||{}),...d};if(d.title&&(!x.title||x.title===cleanTitle(x.name)))x.title=d.title;if(!x.abstract&&d.abstract)x.abstract=d.abstract;if(!x.methods.length&&d.method){const hit=[...d.method.matchAll(/\b(?:LSTM|ARIMA|OLS|Kaya|LMDI|Logistic|PSO|GA|genetic algorithm|neural network|random forest|XGBoost|Transformer|CNN|RNN|SVM|MAM|TOPSIS|AHP)\b/gi)].map(m=>m[0]);x.methods=[...new Set(hit)].slice(0,10)}if(!x.tags.length&&d.keywords?.length)x.tags=d.keywords;return x._derived}

  if(on){const sc=$('.side-scroll');if(sc)requestAnimationFrame(()=>sc.scrollTo({top:sc.scrollHeight,behavior:'auto'}))}
}
$('#editorToggle').onclick=async()=>{await detectHelper();setEditor(!document.body.classList.contains('editor-on'))};
let reviewQueue=[],reviewIndex=0;
function reviewPatchFromForm(){const type=$('#rDocType').value;return {title:$('#rTitle').value.trim(),authors:$('#rAuthors').value.split(';').map(x=>x.trim()).filter(Boolean),year:Number($('#rYear').value)||$('#rYear').value.trim(),month:Number($('#rMonth').value)||$('#rMonth').value.trim(),document_type:type,publication_status:$('#rStatus').value,venue_type:type==='journal_article'?'journal':type==='conference_paper'?'conference':'none',venue:$('#rVenue').value.trim(),venue_short:$('#rVenueShort').value.trim(),doi:$('#rDoi').value.trim(),research_area:$('#rArea').value.trim(),keywords:$('#rKeywords').value.split(';').map(x=>x.trim()).filter(Boolean),methods:$('#rMethods').value.split(';').map(x=>x.trim()).filter(Boolean),abstract:$('#rAbstract').value.trim(),research_question:$('#rProblem').value.trim(),data_sample:$('#rData').value.trim(),findings:$('#rFindings').value.trim()}}
function fillReview(){if(!reviewQueue.length)return closeReview();const row=reviewQueue[reviewIndex],x=row.item||{};$('#reviewProgress').textContent=`${reviewIndex+1} / ${reviewQueue.length}`;$('#reviewChange').innerHTML=`<b>${esc(row.label||'人工重检')}</b> · ${esc(row.name||x.name||'')}${row.old_modified?`<br>原修改时间：${esc(row.old_modified)} → 当前：${esc(row.modified||'')}`:row.modified?`<br>修改时间：${esc(row.modified)}`:''}`;$('#rFile').textContent=x.file||row.file||'';$('#rOpenPdf').href=fileUrl({file:x.file||row.file});$('#rTitle').value=x.title||'';$('#rAuthors').value=Array.isArray(x.authors)?x.authors.join('; '):(x.authors_text||x.authors||'');$('#rYear').value=x.year||'';$('#rMonth').value=x.month||'';$('#rDocType').value=x.document_type||x.documentType||'other';$('#rStatus').value=x.publication_status||'unpublished';$('#rVenue').value=x.venue||'';$('#rVenueShort').value=x.venue_short||'';$('#rDoi').value=x.doi||'';$('#rArea').value=x.research_area||x.topicDetail||'';$('#rKeywords').value=arr(x.keywords).join('; ');$('#rMethods').value=arr(x.methods).join('; ');$('#rAbstract').value=x.abstract||'';$('#rProblem').value=x.research_question||x.problem||'';$('#rData').value=x.data_sample||x.data||'';$('#rFindings').value=x.findings||''}
function openReviewQueue(rows){reviewQueue=rows||[];reviewIndex=0;if(!reviewQueue.length)return toast('没有需要核对的项目');$('#reviewOverlay').classList.add('show');fillReview()}
function closeReview(){$('#reviewOverlay').classList.remove('show');reviewQueue=[];reviewIndex=0}
$('#reviewClose').onclick=closeReview;$('#reviewOverlay').addEventListener('click',e=>{if(e.target.id==='reviewOverlay')closeReview()});
$('#reviewSkip').onclick=()=>{if(reviewIndex<reviewQueue.length-1){reviewIndex++;fillReview()}else{closeReview();toast('人工核对结束')}};
$('#reviewSaveNext').onclick=async()=>{if(!helperAvailable)return toast('请先运行科研管理 BAT');const row=reviewQueue[reviewIndex],b=$('#reviewSaveNext');b.disabled=true;try{await api('/api/research/review-save',{method:'POST',body:JSON.stringify({file:row.file||row.item?.file,patch:reviewPatchFromForm()})});if(reviewIndex<reviewQueue.length-1){reviewIndex++;fillReview();toast('已保存，继续下一项')}else{closeReview();await loadManifest();toast('本轮人工核对已完成')}}catch(e){toast('保存失败：'+e.message)}finally{b.disabled=false}};
async function detectAndReview(){if(!helperAvailable)return toast('请先运行科研管理 BAT');const r=await api('/api/research/scan-changes');if(!r.count)return toast(`已检查 ${r.checked||0} 个 PDF：没有新增或修改时间变化`);const names=r.changes.map(x=>`${x.label}：${x.name}`).join('\n');if(!confirm(`检测到 ${r.count} 项变化：\n\n${names}\n\n是否现在逐项人工核对？`))return;openReviewQueue(r.changes)}
$('#uploadPaperBtn').onclick=()=>{if(!helperAvailable)return toast('请先运行科研管理 BAT');$('#paperFileInput').click()};
$('#paperFileInput').onchange=async e=>{const fs=[...e.target.files].filter(f=>f.name.toLowerCase().endsWith('.pdf'));if(!fs.length)return toast('当前版本仅支持 PDF');for(const f of fs){toast('正在导入：'+f.name);const r=await fetch(apiUrl('/api/research/upload?name='+encodeURIComponent(f.name)),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:await f.arrayBuffer()});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'导入失败')}e.target.value='';await detectAndReview()};
$('#analyzeNewBtn').onclick=detectAndReview;
$('#analyzeAllBtn').onclick=async()=>{if(!helperAvailable)return toast('请先运行科研管理 BAT');if(!confirm(`将把 library.json 中现有 ${items.length} 项成果逐个打开给你人工核对；不会自动解析或覆盖。继续吗？`))return;openReviewQueue(items.map(x=>({kind:'review',label:'人工重检',file:x.file,name:x.name,modified:x.modified,item:{...x,document_type:x.documentType}})))};
$('#openDataBtn').onclick=async()=>{if(!helperAvailable)return toast('请先运行科研管理 BAT');await api('/api/research/open-data')};
$('#exportLibraryBtn').onclick=()=>{const blob=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='library.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function openEdit(){if(!selected)return;const x=selected;$('#eTitle').value=x.title||'';$('#eAuthors').value=x.authors||'';$('#eYear').value=x.year||'';$('#eMonth').value=x.month||'';$('#eDocType').value=x.documentType||'other';$('#eStatus').value=x.publication_status||'unpublished';$('#eVenue').value=x.venue||'';$('#eVenueShort').value=x.venue_short||'';$('#eDoi').value=x.doi||'';$('#eArea').value=x.topicDetail||x.topic||'';$('#eKeywords').value=(x.keywords||x.tags||[]).join('; ');$('#eMethods').value=(x.methods||[]).join('; ');$('#eProblem').value=x.problem||'';$('#eData').value=x.data||'';$('#eFindings').value=x.findings||'';$('#editOverlay').classList.add('show')}
function closeEdit(){$('#editOverlay').classList.remove('show')}
$('#editMetaBtn').onclick=openEdit;$('#editClose').onclick=closeEdit;$('#editCancel').onclick=closeEdit;$('#editOverlay').onclick=e=>{if(e.target.id==='editOverlay')closeEdit()};
$('#editSave').onclick=async()=>{if(!helperAvailable||!selected)return toast('请先运行科研管理 BAT');const patch={title:$('#eTitle').value.trim(),authors:$('#eAuthors').value.split(';').map(x=>x.trim()).filter(Boolean),year:Number($('#eYear').value)||$('#eYear').value.trim(),month:Number($('#eMonth').value)||$('#eMonth').value.trim(),document_type:$('#eDocType').value,publication_status:$('#eStatus').value,venue_type:$('#eDocType').value==='journal_article'?'journal':$('#eDocType').value==='conference_paper'?'conference':'none',venue:$('#eVenue').value.trim(),venue_short:$('#eVenueShort').value.trim(),doi:$('#eDoi').value.trim(),research_area:$('#eArea').value.trim(),keywords:$('#eKeywords').value.split(';').map(x=>x.trim()).filter(Boolean),methods:$('#eMethods').value.split(';').map(x=>x.trim()).filter(Boolean),research_question:$('#eProblem').value.trim(),data_sample:$('#eData').value.trim(),findings:$('#eFindings').value.trim()};await api('/api/research/save-metadata',{method:'POST',body:JSON.stringify({id:selected.id,patch})});closeEdit();closeReader();await loadManifest();toast('已写回 library.json')};
$('#deletePaperBtn').onclick=async()=>{if(!helperAvailable||!selected)return toast('请先运行科研管理 BAT');if(!confirm('删除该成果？原文件会移到 papers/.trash，可手动恢复。'))return;await api('/api/research/delete',{method:'POST',body:JSON.stringify({id:selected.id})});closeReader();await loadManifest();toast('已移到 .trash')};

loadUI();applyTheme(ui.theme);setEditor(false);detectHelper().then(()=>{if(helperAvailable&&new URLSearchParams(location.search).get('maintain')==='1')setEditor(true)});loadManifest();

HongwuMaintenance.register({app:'papers',button:'#editorToggle',section:'.maintain-block',sidebar:'.side-scroll',status:'/api/research/status',identity:'hongwu-research',state:on=>{helperAvailable=on;document.body.classList.toggle('helper-on',on);setEditor(on);$('#maintainStatus').textContent=on?'LOCAL · 自动维护：修改直接写回 library.json。':'ONLINE · 浏览'},save:async()=>true});
async function togglePaperStar(id){if(!HongwuMaintenance.require())return;const x=items.find(x=>x.id===id);if(!x)return;try{await api('/api/research/favorite',{method:'POST',body:JSON.stringify({id,active:!x.favorite})});x.favorite=!x.favorite;renderAll();if(selected?.id===id){selected.favorite=x.favorite;$('#paperReaderStar').textContent=x.favorite?'★ 已收藏':'☆ 收藏'}localStorage.setItem('hongwu_lab_shelf_changed',String(Date.now()))}catch(e){toast('收藏未保存：'+e.message)}}
$('#paperReaderStar').onclick=()=>selected&&togglePaperStar(selected.id);
</script>
</body></html>
