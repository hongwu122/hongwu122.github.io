<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Hongwu AI Toolbox">
<title>Hongwu AI Toolbox</title>
<link rel="preconnect" href="https://www.google.com">
<style>
:root{
  --bg:#f6f7f8;--panel:#fff;--text:#20242a;--muted:#6d7682;--line:#e4e7eb;--line2:#d3d8de;
  --accent:#285f49;--accent-soft:#edf5f1;--sidebar:294px;--top:66px;
  --shadow:0 8px 24px rgba(22,29,37,.055);--ease:cubic-bezier(.22,.75,.22,1)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);z-index:50;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(0);transition:transform .28s var(--ease),box-shadow .28s var(--ease)
}
body.side-hidden .sidebar{transform:translateX(calc(-1 * var(--sidebar) - 8px));box-shadow:none}
.side-head{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lab-back{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;min-width:0}
.lab-back:hover{color:var(--accent)}
.logo-mark{width:36px;height:36px;border:1px solid var(--line2);border-radius:10px;display:grid;place-items:center;font:700 17px Georgia,serif;background:#fff;flex:0 0 auto}
.lab-title{white-space:nowrap}
.side-close{margin-left:auto;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:#68727d;font-size:25px;line-height:1;display:grid;place-items:center;transition:.18s var(--ease)}
.side-close:hover{background:#f4f6f5;transform:translateX(-2px)}
.side-scroll{overflow:auto;padding:12px 10px 28px;scrollbar-width:thin;scrollbar-color:#b9bec4 transparent}
.side-block{margin-bottom:12px}
.block-head{display:flex;align-items:center;gap:8px;padding:8px 8px;color:#7d8792;font-size:12px;font-weight:800}
.block-head .grow{flex:1}
.icon-toggle{width:26px;height:26px;border:0;background:transparent;border-radius:7px;color:#7e8790;cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .18s var(--ease)}
.icon-toggle:hover{background:#f2f4f5}
.icon-toggle.open{transform:rotate(180deg)}

.model-shell{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s var(--ease)}
.model-shell.closed{grid-template-rows:0fr}
.model-shell-inner{overflow:hidden}
.model-list{display:grid;gap:2px}
.model-link{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:#3e444c;transition:background .15s}
.model-link:hover{background:#f4f6f5}
.model-link.extra-model{display:none}
.model-list.expanded .model-link.extra-model{display:flex}
.model-iconwrap,.tool-iconwrap{position:relative;display:grid;place-items:center;overflow:hidden}
.model-iconwrap{width:28px;height:28px;flex:0 0 28px}
.brand-under{position:absolute;inset:0;display:grid;place-items:center;border:1px solid #e8ebee;background:#f7f8f9;color:#687482;font-weight:850}
.model-iconwrap .brand-under{border-radius:7px;font-size:10px}
.model-icon{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:1px solid #eceff1;border-radius:7px;padding:3px;background:#fff;opacity:0;transition:opacity .14s}
.model-icon.ready{opacity:1}
.model-name{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-maker{font-size:10px;color:#9aa2ab;margin-left:auto;white-space:nowrap}
.model-more{min-width:70px;height:30px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#76808a;display:flex;align-items:center;justify-content:center;gap:5px;margin:6px auto 2px;padding:0 10px;font-size:11.5px;transition:.18s}
.model-more:hover{background:#f2f4f5;color:#4f5963}

.tools-head{margin-top:5px}
.all-row{display:flex;align-items:center;border-radius:9px;margin:1px 2px 7px;transition:background .15s}
.all-row.active{background:var(--accent-soft);color:var(--accent)}
.all-tools-btn{flex:1;border:0;background:transparent;padding:9px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;font-size:13px;font-weight:800}
.all-tools-btn .count{margin-left:auto;font-variant-numeric:tabular-nums}
.all-cats-toggle{width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#76808a;display:grid;place-items:center;transition:transform .2s var(--ease),background .15s}
.all-cats-toggle:hover{background:rgba(0,0,0,.035)}
.all-cats-toggle.open{transform:rotate(180deg)}
.group-shell{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s var(--ease)}
.group-shell.closed{grid-template-rows:0fr}
.group-shell-inner{overflow:hidden}

.group-nav{margin:6px 0 8px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.group-head{width:100%;border:0;display:flex;align-items:center;gap:9px;padding:9px 9px;background:var(--gsoft);color:var(--gcolor);cursor:pointer;font-weight:820;font-size:12.5px;text-align:left}
.group-dot{width:8px;height:8px;border-radius:50%;background:var(--gcolor);flex:0 0 auto}
.group-name{flex:1}.group-total{font-size:10px;opacity:.72}.group-arrow{font-size:10px;transition:transform .2s var(--ease)}
.group-nav.open .group-arrow{transform:rotate(180deg)}
.cat-shell{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease);background:#fff}
.group-nav.open .cat-shell{grid-template-rows:1fr}
.cat-shell-inner{overflow:hidden}
.cat-list{padding:4px}
.cat-link{width:100%;display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;border:0;background:transparent;text-align:left;cursor:pointer;color:#505862;font-size:12.5px;transition:background .12s}
.cat-link:hover{background:#f5f6f7}
.cat-link.active{background:#eef3f0;color:#285f49;font-weight:760}
.cat-color{width:3px;height:17px;border-radius:99px;background:var(--gcolor);opacity:.68}
.cat-name{flex:1}.cat-count{font-size:10px;color:#a0a7af;font-variant-numeric:tabular-nums}

.main{margin-left:var(--sidebar);min-height:100vh;transition:margin-left .28s var(--ease)}
body.side-hidden .main{margin-left:0}
.topbar{position:sticky;top:0;z-index:30;height:var(--top);background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.topbar-inner{height:100%;max-width:1490px;margin:auto;padding:10px 24px;display:flex;gap:12px;align-items:center}
.side-open{width:40px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;display:none;place-items:center;color:#59636d;transition:.18s var(--ease)}
body.side-hidden .side-open{display:grid}
.side-open:hover{background:#f6f7f8;transform:translateX(2px)}
.search-wrap{position:relative;flex:1;max-width:950px}
.search-wrap input{
  width:100%;height:44px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:0 78px 0 43px;
  outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s,background .15s
}
.search-wrap input:hover{border-color:#c4cad0}
.search-wrap input:focus{border-color:#7fa48f;box-shadow:0 0 0 4px rgba(40,95,73,.075)}
.search-icon{position:absolute;left:15px;top:12px;color:#7b858e;width:18px;height:18px;pointer-events:none}
.search-clear{position:absolute;right:9px;top:8px;width:30px;height:30px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#8b949c;font-size:18px;display:none;place-items:center}
.search-clear.show{display:grid}.search-clear:hover{background:#f1f3f4;color:#4d555d}
.header-stat{margin-left:auto;color:#858d96;font-size:12px;white-space:nowrap}

.content{max-width:1490px;margin:auto;padding:10px 28px 72px}
.hero{margin:7px 0 25px}
.hero h1{margin:0;font-size:36px;letter-spacing:-.035em;font-weight:850}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:25px}
.filter-group{display:flex;gap:4px;align-items:center}.filter-label{font-size:12px;color:#8a919a;padding:0 4px}
.filter-btn{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.filter-btn:hover{background:#f5f6f7}.filter-btn.active{background:var(--accent-soft);border-color:#d8e8df;color:var(--accent);font-weight:750}
.filter-sep{height:22px;width:1px;background:var(--line);margin:0 3px}.result-info{margin-left:auto;color:#9098a1;font-size:12px}

.work-group{margin:0 0 39px;scroll-margin-top:84px}
.work-head{display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid var(--line);padding:0 0 11px;margin:0 0 18px;min-width:0;flex-wrap:wrap}
.work-pill{font-size:13px;font-weight:850;padding:6px 11px;border:1px solid color-mix(in srgb,var(--gcolor) 18%,transparent);border-radius:9px;background:var(--gsoft);color:var(--gcolor);flex:0 0 auto;cursor:pointer;transition:.14s}
.work-pill:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.04)}
.task-strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;white-space:normal;min-width:0;flex:1}
.task-chip{border:1px solid #e3e7ea;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;color:#6f7882;font-size:12px;line-height:1.2;transition:background .12s,color .12s,border-color .12s}
.task-chip:hover{background:var(--gsoft);color:var(--gcolor);border-color:color-mix(in srgb,var(--gcolor) 22%,#e3e7ea)}
.work-count{margin-left:auto;font-size:11px;color:#a0a7ae;white-space:nowrap;flex:0 0 auto;padding-top:7px}

.category-section{margin:0 0 28px;scroll-margin-top:84px}
.section-head{display:flex;align-items:baseline;gap:9px;margin:0 0 11px}
.section-title{font-size:19px;font-weight:820;margin:0;cursor:pointer;border-radius:7px;padding:2px 4px 2px 0;transition:color .12s}.section-title:hover{color:var(--accent)}.section-count{font-size:11px;color:#9aa2ab}
.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.tool-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;min-height:142px;transition:border-color .15s,box-shadow .15s,transform .15s;overflow:hidden}
.tool-card:hover{border-color:#cbd2ce;box-shadow:var(--shadow);transform:translateY(-1px)}
.tool-main{display:block;padding:15px 78px 14px 15px;height:100%}
.tool-top{display:flex;align-items:center;gap:12px}
.tool-iconwrap{width:54px;height:54px;flex:0 0 54px;border-radius:12px}
.tool-iconwrap .brand-under{border-radius:12px;font-size:14px}
.tool-icon{position:absolute;inset:0;width:100%;height:100%;border:1px solid #e8ebee;border-radius:12px;object-fit:contain;padding:5px;background:#fff;opacity:0;transition:opacity .14s}
.tool-icon.ready{opacity:1}
.tool-name{font-size:18px;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.badge{font-size:10.5px;line-height:1;padding:4px 6px;border-radius:5px;background:#f3f4f6;color:#6f7780}
.badge.cn{background:#f0f6f2;color:#416655}.badge.hot{background:#fff4e8;color:#9b5b18}.badge.cat{background:#f4f2f8;color:#6d5d7f}
.tool-desc{margin:11px 0 0;color:#667085;font-size:13px;line-height:1.56;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.visit{position:absolute;right:13px;bottom:11px;color:#9ba3ac;font-size:13px;pointer-events:none}
.fav-btn,.recent-btn{position:absolute;top:8px;width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:#a0a7ae;cursor:pointer;line-height:30px;padding:0}
.fav-btn{right:9px;font-size:18px}.recent-btn{right:41px;font-size:11px;font-weight:800}
.fav-btn:hover,.recent-btn:hover{background:#f4f5f6;color:#59616a}.fav-btn.on{color:#c98926}.recent-btn.on{background:#edf5f1;color:#285f49}

.search-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.search-head h2{font-size:20px;margin:0}.search-head span{font-size:12px;color:#929aa3}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:64px 20px;text-align:center;color:#8a919a}
.footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;color:#9aa2aa;font-size:11.5px}
.hidden{display:none!important}

@media(max-width:1280px){.tool-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){
  .sidebar{box-shadow:0 14px 38px rgba(0,0,0,.13)}
  .main,body.side-hidden .main{margin-left:0}
  body:not(.mobile-side-open) .sidebar{transform:translateX(calc(-1 * var(--sidebar) - 8px))}
  body.mobile-side-open .sidebar{transform:translateX(0)}
  .side-open{display:grid!important}
  .mobile-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
  body.mobile-side-open .mobile-backdrop{opacity:1;pointer-events:auto}
  .topbar-inner{padding:10px 14px}.content{padding:24px 16px 60px}.tool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:660px){
  .hero h1{font-size:30px}.tool-grid{grid-template-columns:1fr}
  .filters{align-items:flex-start}.filter-sep{display:none}.result-info{width:100%;margin:3px 4px 0}
  .header-stat{display:none}.search-wrap input{padding-right:46px}.content{padding-top:21px}
  .work-head{align-items:flex-start}.task-strip{width:100%;flex-basis:100%}.work-count{margin-left:auto}
}

/* ===== 2026-09-30 unified shell · based on latest uploaded files ===== */
.side-head{height:66px!important;padding:0 14px!important}
.side-close,.side-open{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;padding:0!important;align-items:center!important;justify-content:center!important;line-height:1!important;flex:0 0 42px!important}
.side-close{display:grid!important}
.side-open{display:none!important}
body.side-hidden .side-open{display:grid!important}
@media(max-width:980px){.side-open{display:grid!important}}
.side-close svg,.side-open svg{width:18px!important;height:18px!important;display:block!important}
.side-close svg{transform:translateX(-.5px)}
.side-close:hover,.side-open:hover{transform:none!important}
.shell-brand-copy{min-width:0;display:block;line-height:1.1}
.shell-brand-title{display:block;font-size:15.5px;font-weight:830;letter-spacing:.035em;white-space:nowrap}
.shell-brand-sub{display:block;margin-top:4px;font-size:9.5px;font-weight:500;color:#939b96;letter-spacing:.075em;white-space:nowrap}

.lab-back{flex:1!important;font-weight:inherit!important}.logo-mark{font-size:12px!important;border-radius:8px!important;color:var(--accent)!important}.lab-title{display:none!important}
.hero{padding-top:18px!important}.hero h1{font-size:34px!important;letter-spacing:.02em!important}.hero-en{margin-top:6px;font-size:10px;color:#929aa3;letter-spacing:.12em}


/* ===== 2026-09-30 search UI fine-tune ===== */
.search-wrap{max-width:950px!important;min-width:240px}
.search-wrap input{height:44px!important;border-radius:10px!important;padding:0 44px 0 43px!important;font-size:14px!important}
.search-icon{left:15px!important;top:13px!important;width:18px!important;height:18px!important}
.search-clear{display:none!important}
.search-wrap input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:auto!important;appearance:auto!important;cursor:pointer}

</style>
<style>
/* Shared header geometry. */
:root{--sidebar:294px;--top:66px;--topH:66px}
.side-head{height:66px!important;min-height:66px!important;padding:0 14px!important;gap:10px!important}
.side-close,.side-open{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;flex:0 0 42px!important;border-radius:5px!important;padding:0!important;line-height:1!important;align-items:center!important;justify-content:center!important}
.side-close{margin-left:auto!important}.side-close svg{width:18px!important;height:18px!important}
.top-inner{max-width:none!important;padding:10px 24px!important;gap:12px!important}
header.topbar:not(:has(.top-inner)){padding-left:24px!important;padding-right:24px!important;gap:12px!important}
.search-wrap,div.search{max-width:none!important;min-width:0!important;flex:1!important}
input.search,.search input{height:44px!important;border-radius:10px!important;padding-left:43px!important;padding-right:44px!important;font-size:14px!important}
.search-icon{left:15px!important;right:auto!important;top:50%!important;transform:translateY(-50%)!important;width:18px!important;height:18px!important;pointer-events:none}
@media(max-width:980px){.top-inner,header.topbar:not(:has(.top-inner)){padding-left:14px!important;padding-right:14px!important}}

body .top-row .search-icon,body .search-wrap>.search-icon,body div.search>.search-icon{position:absolute!important;left:15px!important;top:22px!important;transform:translateY(-50%)!important;margin:0!important;display:block!important;width:18px!important;height:18px!important}
body .side-close svg{width:22px!important;height:22px!important;transform:none!important}body .side-close{font-size:26px!important}
body .brand-copy b{font-family:"LiSu","STLiti","Songti SC","STSong",serif!important;font-size:18px!important;font-weight:700!important;letter-spacing:.08em!important}

</style></head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <a class="lab-back" href="../index.html#home"><span class="logo-mark">AI</span><span class="shell-brand-copy"><strong class="shell-brand-title">智器百工</strong><small class="shell-brand-sub">HONGWU · AI TOOLBOX</small></span></a>
    <button class="side-close" id="sideClose" aria-label="收起侧边栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="side-scroll" id="sideScroll">
    <section class="side-block">
      <div class="block-head">
        <span>常用大模型</span><span class="grow"></span>
        <button class="icon-toggle open" id="modelBlockToggle" aria-label="折叠常用大模型">⌃</button>
      </div>
      <div class="model-shell" id="modelShell"><div class="model-shell-inner">
        <nav class="model-list" id="modelList"></nav>
        <button class="model-more" id="modelMore" aria-label="展开更多大模型">更多 <span>⌄</span></button>
      </div></div>
    </section>

    <section class="side-block tools-head">
      <div class="block-head"><span>工具分类 · 按工作场景</span></div>
      <div class="all-row active" id="allRow">
        <button class="all-tools-btn" id="allTools"><span>全部工具</span><span class="count" id="allCount"></span></button>
        <button class="all-cats-toggle open" id="allCatsToggle" aria-label="折叠所有工作场景">⌃</button>
      </div>
      <div class="group-shell" id="groupShell"><div class="group-shell-inner"><div id="groupNav"></div></div></div>
    </section>
  </div>
</aside>
<div class="mobile-backdrop" id="backdrop"></div>

<div class="main" id="main">
  <div class="topbar">
    <div class="topbar-inner">
      <button class="side-open" id="sideOpen" aria-label="打开侧边栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="search" type="search" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="清空搜索">×</button>
      </div>
      <div class="header-stat"><strong id="headCount"></strong> tools · <span id="headCats"></span> categories</div>
    </div>
  </div>

  <main class="content">
    <section class="hero"><h1>智器百工</h1><div class="hero-en">HONGWU · AI TOOLBOX</div></section>

    <div class="filters">
      <div class="filter-group" id="regionFilters">
        <span class="filter-label">地区</span>
        <button class="filter-btn active" data-region="全部">全部</button>
        <button class="filter-btn" data-region="国内">国内</button>
        <button class="filter-btn" data-region="国外">国外</button>
      </div>
      <span class="filter-sep"></span>
      <div class="filter-group" id="modeFilters">
        <span class="filter-label">查看</span>
        <button class="filter-btn active" data-mode="全部">全部</button>
        <button class="filter-btn" data-mode="热门">热门</button>
        <button class="filter-btn" data-mode="常用">常用</button>
        <button class="filter-btn" data-mode="收藏">我的收藏</button>
      </div>
      <div class="result-info" id="resultInfo"></div>
    </div>

    <div id="browseView"></div>

/* ---------- Icons: instant fallback + browser/localStorage cache ---------- */
const ICON_CACHE_KEY="hongwu-ai-icon-cache-v3",ICON_TTL=7*24*60*60*1000;
let iconCache={};
try{iconCache=JSON.parse(localStorage.getItem(ICON_CACHE_KEY)||"{}")||{}}catch(e){iconCache={}}
function saveIconCache(){try{localStorage.setItem(ICON_CACHE_KEY,JSON.stringify(iconCache))}catch(e){}}
function hostInfo(url){try{const u=new URL(url);return {origin:u.origin,host:u.hostname.replace(/^www\./,"")}}catch(e){return null}}
function iconCandidates(url,explicit=""){
  const h=hostInfo(url);if(!h)return [];
  const google=`https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(url)}&sz=128`;
  const direct=`${h.origin}/favicon.ico`,apple=`${h.origin}/apple-touch-icon.png`;
  const duck=`https://icons.duckduckgo.com/ip3/${h.host}.ico`;
  return [...new Set([explicit,google,direct,apple,duck].filter(Boolean))];
}
function bindIcon(img,url,explicit=""){
  const h=hostInfo(url);if(!h){img.remove();return}
  const key=(explicit||"")+"|"+h.host,now=Date.now();
  const cached=iconCache[key];
  let candidates=iconCandidates(url,explicit);
  if(cached&&cached.src&&now-cached.ts<ICON_TTL)candidates=[cached.src,...candidates.filter(x=>x!==cached.src)];
  let i=0;
  const tryNext=()=>{
    if(i>=candidates.length){img.remove();return}
    const src=candidates[i++];
    img.onload=()=>{img.classList.add("ready");iconCache[key]={src,ts:Date.now()};saveIconCache()};
    img.onerror=()=>{if(iconCache[key]?.src===src){delete iconCache[key];saveIconCache()}tryNext()};
    img.src=src;
  };
  tryNext();
}

/* ---------- Fuzzy search ---------- */
function subseqScore(q,s){
  let qi=0,last=-1,gaps=0,start=999;
  for(let i=0;i<s.length&&qi<q.length;i++){
    if(s[i]===q[qi]){if(qi===0)start=i;if(last>=0)gaps+=i-last-1;last=i;qi++}
  }
  if(qi<q.length)return 0;
  return Math.max(500,5200-start*35-gaps*45-(s.length-q.length)*3)
}
function levRatio(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  if(a.length>28||b.length>45)return 0;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return 1-prev[b.length]/Math.max(a.length,b.length);
}
function tokenScore(raw,t){
  const q=norm(raw),n=norm(t.name),cat=norm(t.cat),grp=norm(catToGroup[t.cat]||""),desc=norm(t.desc);
  if(!q)return 1;
  let s=0;
  if(n===q)s=100000;
  else if(n.startsWith(q))s=90000-(n.length-q.length)*5;
  else{
    const i=n.indexOf(q);if(i>=0)s=Math.max(s,80000-i*45-(n.length-q.length));
    s=Math.max(s,subseqScore(q,n));
    const lr=levRatio(q,n);if(lr>=.5)s=Math.max(s,21000+Math.round(lr*23000));
  }
  if(cat===q)s=Math.max(s,88000);else if(cat.startsWith(q))s=Math.max(s,76000);else if(cat.includes(q))s=Math.max(s,65000);
  if(grp===q)s=Math.max(s,85000);else if(grp.startsWith(q))s=Math.max(s,73000);else if(grp.includes(q))s=Math.max(s,62000);
  const di=desc.indexOf(q);if(di>=0)s=Math.max(s,12000-Math.min(di,500));
  return s;
}
function fuzzyScore(query,t){
  const parts=String(query).trim().split(/\s+/).filter(Boolean);if(!parts.length)return 1;
  let total=0;
  for(const p of parts){const s=tokenScore(p,t);if(!s)return 0;total+=s}
  if(t.hot)total+=80;return total;
}

/* ---------- Persistent DOM search: move nodes, never recreate them ---------- */
let searchActive=false,moved=new Set();
function restoreMoved(){
  [...moved].sort((a,b)=>a.index-b.index).forEach(r=>r.home.appendChild(r.node));
  moved.clear();
}
function clearSearch(focus=false){
  if(!$("#search").value&&!searchActive){if(focus)$("#search").focus();return}
  $("#search").value="";$("#searchClear").classList.remove("show");
  if(searchActive){restoreMoved();searchActive=false}
  $("#searchView").classList.add("hidden");$("#browseView").classList.remove("hidden");
  applyBrowseVisibility();
  if(focus)$("#search").focus();
}
$("#searchClear").onclick=()=>clearSearch(true);

function runSearch(){
  const q=$("#search").value.trim();
  $("#searchClear").classList.toggle("show",!!q);
  if(!q){clearSearch(false);return}

  if(searchActive)restoreMoved();
  searchActive=true;
  $("#browseView").classList.add("hidden");$("#searchView").classList.remove("hidden");

  const scored=records
    .filter(r=>eligible(r.t))
    .map(r=>({r,score:fuzzyScore(q,r.t)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score||Number(b.r.t.hot)-Number(a.r.t.hot)||a.r.t.name.localeCompare(b.r.t.name,"zh-CN"));

  const grid=$("#searchGrid");
  scored.forEach(x=>{grid.appendChild(x.r.node);moved.add(x.r)});
  $("#searchEmpty").classList.toggle("hidden",scored.length>0);
  $("#searchEmpty").textContent=scored.length?"":`没有找到与“${q}”接近的工具`;
  $("#resultInfo").textContent=`显示 ${scored.length} / ${tools.length} 个工具`;
}
let searchTimer;
$("#search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,45)});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#search")){e.preventDefault();$("#search").focus()}
  if(e.key==="Escape"){clearSearch(false);$("#search").blur()}
});

/* ---------- Browse visibility without rebuilding ---------- */
function applyBrowseVisibility(){
  let visibleTotal=0;
  records.forEach(r=>{
    const show=eligible(r.t);r.node.classList.toggle("hidden",!show);if(show)visibleTotal++;
  });
  groups.forEach(g=>{
    let gv=0;
    g.cats.forEach(c=>{
      const sec=catSections.get(c);
      const cv=records.filter(r=>r.t.cat===c&&eligible(r.t)).length;
      sec.classList.toggle("hidden",cv===0);
      sec.querySelector(".section-count").textContent=`${cv} 个`;
      gv+=cv;
    });
    const gs=groupSections.get(g.name);gs.classList.toggle("hidden",gv===0);
    gs.querySelector(".work-count").textContent=`${gv} 个`;
  });
  $("#resultInfo").textContent=`显示 ${visibleTotal} / ${tools.length} 个工具`;
}
function applyView(){searchActive?runSearch():applyBrowseVisibility()}

/* ---------- Jump / sync left sidebar with main scroll ---------- */
let currentCat="";
function ensureGroupOpen(groupName){
  allGroupsVisible=true;$("#groupShell").classList.remove("closed");$("#allCatsToggle").classList.add("open");
  const gn=groupNodes.get(groupName);if(gn)gn.classList.add("open");
}
function setActiveCat(cat,scrollSide=true){
  if(!cat)return;
  currentCat=cat;
  catLinks.forEach((b,c)=>b.classList.toggle("active",c===cat));
  $("#allRow").classList.remove("active");
  const g=catToGroup[cat];ensureGroupOpen(g);
  if(scrollSide){
    const b=catLinks.get(cat);
    if(b)b.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
function setAllActive(){
  currentCat="";
  catLinks.forEach(b=>b.classList.remove("active"));
  $("#allRow").classList.add("active");
}
function focusCatInSidebar(cat){
  openSidebar();
  setActiveCat(cat,true);
}
function focusGroupInSidebar(groupName){
  openSidebar();ensureGroupOpen(groupName);
  const gn=groupNodes.get(groupName);if(gn)gn.scrollIntoView({block:"center",behavior:"smooth"});
}
function jumpToCat(cat,fromNav=false){
  clearSearch(false);
  setActiveCat(cat,true);
  requestAnimationFrame(()=>catSections.get(cat)?.scrollIntoView({behavior:"smooth",block:"start"}));
  if(window.innerWidth<=980)closeMobile();
}
function jumpToGroup(groupName){
  clearSearch(false);ensureGroupOpen(groupName);
  requestAnimationFrame(()=>groupSections.get(groupName)?.scrollIntoView({behavior:"smooth",block:"start"}));
}

const observer=new IntersectionObserver(entries=>{
  if(searchActive)return;
  const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
  if(visible.length)setActiveCat(visible[0].target.dataset.cat,true);
},{root:null,rootMargin:"-76px 0px -72% 0px",threshold:[0,.01]});
catSections.forEach(sec=>observer.observe(sec));

/* ---------- Sidebar open/close ---------- */
const isMobile=()=>window.matchMedia("(max-width:980px)").matches;
function openSidebar(){
  if(isMobile())document.body.classList.add("mobile-side-open");
  else document.body.classList.remove("side-hidden");
}
function closeSidebar(){
  if(isMobile())document.body.classList.remove("mobile-side-open");
  else document.body.classList.add("side-hidden");
}
function closeMobile(){document.body.classList.remove("mobile-side-open")}
$("#sideClose").onclick=closeSidebar;
$("#sideOpen").onclick=openSidebar;
$("#backdrop").onclick=closeMobile;
window.addEventListener("resize",()=>{if(!isMobile())document.body.classList.remove("mobile-side-open")});

/* ---------- Initial state ---------- */
updateFilterButtons();
applyBrowseVisibility();
setAllActive();
</script>
