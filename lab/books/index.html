window.HongwuMaintenance={active:false,register(o){

 const badge=document.querySelector(o.button); if(!badge)return;

 const panel=document.querySelector(o.section);
 if(panel){
  const labels=[...panel.querySelectorAll('button')].map(b=>b.textContent.trim());
  if(!labels.some(t=>t.includes('刷新页面'))){const group=panel.querySelector('.maintain-actions,.maint-buttons')||panel;const b=document.createElement('button');b.type='button';b.className=o.app==='travel'?'maint-action':'maintain-action';if(o.app==='travel')b.innerHTML='<b>刷新页面</b><span>重新载入网页与路线数据。</span>';else b.textContent='刷新页面';b.onclick=async()=>{if(!self.require())return;try{if(await o.save?.()===false)return;location.reload()}catch(e){alert(e.message)}};group.append(b)}
 }

 async function json(url,opt){const r=await fetch(url,{cache:'no-store',...opt});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||j.error||'服务未响应');return j}
 function draw(){badge.textContent=busy?'正在处理…':self.active?'LOCAL · 自动维护（点击关闭维护）':hub?'ONLINE · 浏览（点击启动维护）':'ONLINE · 浏览';badge.disabled=busy||!hub;badge.classList.remove('mode-file','mode-online','mode-maintain');badge.classList.toggle('mode-local',self.active);badge.classList.toggle('mode-online',!self.active);const section=document.querySelector(o.section);if(section)section.hidden=!self.active;}
 async function refresh(){let active=false;hub=false;if(local){try{const j=await json('/__local/status');hub=j.local===true;active=hub&&j.apps?.[o.app]?.running===true}catch(_){try{const j=await json(o.status);active=j.app===o.identity||j.service===o.identity}catch(_){}}}
 self.active=active;document.body.classList.toggle('hw-local',active);if(last!==active){o.state(active);if(active){const sc=document.querySelector(o.sidebar);requestAnimationFrame(()=>sc?.scrollTo({top:sc.scrollHeight,behavior:'auto'}))}last=active}draw();return active;}
 async function toggle(){if(busy)return;if(!hub){alert('请使用项目中的启动维护 BAT 打开本地页面。GitHub 和直接打开 HTML 均为浏览模式。');return}busy=true;draw();try{if(self.active&&o.save){const ok=await o.save();if(ok===false)throw Error('保存未完成，请检查后再关闭维护')}await json('/__local/'+(self.active?'stop/':'launch/')+o.app,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await refresh()}catch(e){alert(e.message)}finally{busy=false;draw()}}
 document.addEventListener('click',e=>{if(!self.active&&e.target.closest('#ok,#editSave,#reviewSaveNext,#saveWorkBtn,#saveEditorBtn,#deleteBook,#deletePaperBtn,#downloadCover,#verifySource')){e.preventDefault();e.stopImmediatePropagation();self.require();return}if(e.target.closest(o.button)){e.preventDefault();e.stopImmediatePropagation();toggle()}},true);
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();e.stopImmediatePropagation();toggle()}},true);
 self.draw=draw;self.refresh=refresh;self.require=()=>{if(self.active)return true;const msg='请先点击右上角按钮启动维护，再修改收藏或作品。';if(o.notify)o.notify(msg);else{let n=document.getElementById('hwNotice');if(!n){n=document.createElement('div');n.id='hwNotice';document.body.append(n)}n.textContent=msg;n.hidden=false;setTimeout(()=>n.hidden=true,3500)}return false};
 refresh();setInterval(()=>{if(!busy)refresh()},5000);window.addEventListener('focus',refresh);
 }};

function card(b,i){const link=b.url||('https://www.google.com/search?tbm=bks&q='+encodeURIComponent((b.lookup_query||b.title||'')+' '+(b.author||'')));return `<article class="book" data-card-index="${i}"><div class="book-tools"><button class="round edit-only ${b.favorite?'on':''}" data-fav="${i}" title="收藏">${b.favorite?'★':'☆'}</button><button class="round edit-only ${b.reading?'on':''}" data-read="${i}" title="在读">${b.reading?'●':'○'}</button></div><div class="cover" data-detail="${i}">${b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.title)}封面" loading="lazy">`:`<div class="fallback">${esc((b.title||'书').slice(0,5))}</div>`}</div><div><h3 data-detail="${i}">${esc(b.title||'未命名')}</h3><div class="original-title">${esc(b.original_title||'')}</div><div class="author">${esc(b.author||'作者待补')}<br><span lang="en">${esc(b.original_author||'')}</span></div></div><div class="tags"><span class="tag">${esc(b.category||'未分类')}</span><span class="tag">${esc(b.status||'在架')}</span>${b.isbn?`<span class="tag">ISBN ${esc(b.isbn)}</span>`:''}${b.platform?`<span class="tag">${esc(b.platform)}</span>`:''}</div><div class="book-actions">${b.pdf?`<a class="mini primary" href="${esc(b.pdf)}" target="_blank">电子书 ↗</a>`:''}<a class="mini" href="${esc(link)}" target="_blank" rel="noopener">在线阅读 / 书目 ↗</a><span class="grow"></span><button class="mini edit-only" data-auto="${i}">自动查询</button><button class="mini edit-only" data-edit="${i}">编辑</button></div></article>`}
function render(){const rows=db.books.map((b,i)=>[b,i]).filter(([b])=>matchBook(b));$('grid').innerHTML=rows.length?rows.map(([b,i])=>card(b,i)).join(''):'<div class="empty">没有匹配的书。</div>';$('mTotal').textContent=db.books.length;$('mReading').textContent=db.books.filter(b=>b.reading).length;$('mFav').textContent=db.books.filter(b=>b.favorite).length;$('mCover').textContent=db.books.filter(b=>b.cover).length;$('countAll').textContent=db.books.length;$('countFav').textContent=db.books.filter(b=>b.favorite).length;$('countReading').textContent=db.books.filter(b=>b.reading).length;$('resultInfo').textContent='显示 '+rows.length+' / '+db.books.length+' 本';$('viewTitle').textContent=view==='favorite'?'收藏书签':view==='reading'?'最近在读':view==='category'?category:fullText?'全文检索':'全部书籍';bindCards()}
function bindCards(){document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>showBook(+x.dataset.detail));document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>openEdit(+x.dataset.edit));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=async()=>{if(saving)return toast('正在保存，请稍候');const b=db.books[+x.dataset.fav],old=b.favorite;b.favorite=!b.favorite;b.favorite_at=b.favorite?new Date().toISOString():'';dirty=true;render();if(!await saveBooks()){b.favorite=old;render()}});document.querySelectorAll('[data-read]').forEach(x=>x.onclick=()=>{const b=db.books[+x.dataset.read];dirty=true;b.reading=!b.reading;if(b.reading)b.status='在读';render()});document.querySelectorAll('[data-auto]').forEach(x=>x.onclick=async()=>{const i=+x.dataset.auto,b=db.books[i];x.disabled=true;x.textContent='查询中';const m=await lookupMeta(b,true);await applyMeta(b,m);dirty=true;x.disabled=false;render();toast(m.ok?'已匹配图书信息':'未精确匹配，已生成搜索入口')})}
async function applyMeta(b,m){if(m.author)b.author=m.author;if(m.cover)b.cover=await localCover(m.cover);if(m.url)b.url=m.url;if(m.platform)b.platform=m.platform;if(m.isbn&&!b.isbn)b.isbn=m.isbn}
function syncMode(){const can=window.HongwuMaintenance.active;if(bookMgr)document.querySelector('.side-bottom a').href='http://127.0.0.1:8000/lab/';document.body.classList.toggle('editor-on',can&&editing);$('maint').textContent=!can?'ONLINE · 只读':editing?'LOCAL · 关闭维护':'LOCAL · 启动维护';$('maint').classList.toggle('on',editing);$('add').classList.toggle('hidden',!(can&&editing));$('save').classList.toggle('hidden',!(can&&editing))}
window.addEventListener('focus',()=>{if(!dirty&&!editing)load()});
$('maint').onclick=async()=>{if(!(rootHub||bookMgr))return toast('ONLINE 模式只读');if(editing&&dirty&&!await saveBooks())return;editing=!editing;syncMode()};$('sideClose').onclick=()=>{document.body.classList.add('side-hidden');document.body.classList.remove('mobile-side-open')};$('sideOpen').onclick=()=>{document.body.classList.remove('side-hidden');document.body.classList.add('mobile-side-open')};$('q').oninput=render;$('fullTextBtn').onclick=()=>{view='all';category='';fullText=true;setActive($('fullTextBtn'));$('q').focus();render()};$('randomBtn').onclick=()=>{if(!db.books.length)return;const i=Math.floor(Math.random()*db.books.length);view='all';category='';$('q').value='';render();setTimeout(()=>document.querySelector('[data-card-index="'+i+'"]')?.scrollIntoView({behavior:'smooth',block:'center'}),80)};
function openEdit(i=-1){editIndex=i;const b=i>=0?db.books[i]:{title:'',author:'',isbn:'',category:'未分类',status:'在架',format:'纸书',lookup_query:'',url:'',cover:'',pdf:'',notes:''};$('candidates').innerHTML='';$('sourceStatus').textContent='';$('deleteBook').classList.toggle('hidden',i<0);lookupPlatformName=b.platform||'';$('dialogTitle').textContent=i>=0?'编辑图书':'新增图书';for(const [id,key] of [['fTitle','title'],['fAuthor','author'],['fIsbn','isbn'],['fCategory','category'],['fStatus','status'],['fFormat','format'],['fLookup','lookup_query'],['fUrl','url'],['fCover','cover'],['fPdf','pdf'],['fNotes','notes']])$(id).value=b[key]||'';$('fPlatform').value=b.lookup_platform||'';$('lookupStatus').textContent='';$('dialog').classList.remove('hidden')}
function formBook(){const old=editIndex>=0?db.books[editIndex]:{};return {...old,id:old.id||'book-'+Date.now(),lookup_platform:$('fPlatform').value,title:$('fTitle').value.trim(),author:$('fAuthor').value.trim(),isbn:$('fIsbn').value.trim(),category:$('fCategory').value.trim()||'未分类',status:$('fStatus').value.trim()||'在架',format:$('fFormat').value.trim()||'纸书',lookup_query:$('fLookup').value.trim(),url:$('fUrl').value.trim(),cover:$('fCover').value.trim(),pdf:$('fPdf').value.trim(),notes:$('fNotes').value.trim(),favorite:!!old.favorite,reading:!!old.reading,platform:lookupPlatformName||old.platform||'manual'}}
$('add').onclick=()=>openEdit(-1);$('cancel').onclick=()=>$('dialog').classList.add('hidden');$('ok').onclick=async()=>{const b=formBook();if(!b.title)return toast('请填写书名');if(editIndex>=0)db.books[editIndex]=b;else db.books.unshift(b);dirty=true;if(!await saveBooks())return;$('dialog').classList.add('hidden');buildCats();render()};$('lookup').onclick=async()=>{const b=formBook();if(!b.title)return toast('先填写书名');$('lookupStatus').textContent='正在多源查询…';const m=await lookupMeta(b,true);if(m.author)$('fAuthor').value=m.author;if(m.isbn)$('fIsbn').value=m.isbn;if(m.url)$('fUrl').value=m.url;if(m.cover)$('fCover').value=await localCover(m.cover);lookupPlatformName=m.platform||lookupPlatformName;showCandidates(m);$('lookupStatus').textContent=(m.ok?'已可靠匹配：':'未自动绑定错误书目，已给搜索入口：')+(m.platform||'搜索入口')};
async function localCover(url){if(!/^https?:/.test(url))return url;try{const r=await fetch(endpoint('asset'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,kind:'cover'})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message);return d.path}catch(e){toast('封面下载失败，可上传替换：'+e.message);return url}}
function showCandidates(m){const rows=[m,...(m.alternatives||[])];$('candidates').innerHTML=rows.map((x,i)=>'<button type="button" data-candidate="'+i+'">'+esc([x.title,x.author,x.platform,x.isbn].filter(Boolean).join(' · '))+'</button>').join('');$('candidates').querySelectorAll('[data-candidate]').forEach(el=>el.onclick=async()=>{const x=rows[+el.dataset.candidate];lookupPlatformName=x.platform||'';$('fAuthor').value=x.author||'';$('fIsbn').value=x.isbn||'';$('fUrl').value=x.url||'';$('fCover').value=x.cover?await localCover(x.cover):'';$('lookupStatus').textContent='已选择 '+(x.platform||'书目')})}
$('save').onclick=saveBooks;
async function saveBooks(){
 if(saving)return saving;
 saving=(async()=>{try{const r=await fetch(endpoint('save'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...db,_base_books:baseBooks,updated:new Date().toISOString().slice(0,10)})});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||'保存失败');baseBooks=JSON.parse(JSON.stringify(db.books));dirty=false;localStorage.setItem('hongwu_lab_shelf_changed',String(Date.now()));toast('图书已保存，主页收藏已同步');return true}catch(e){toast('保存失败：'+e.message);return false}})();
 try{return await saving}finally{saving=null}
}
function showBook(i){const b=db.books[i];if(!b)return;$('detailBody').innerHTML=(b.cover?'<img class="detail-cover" src="'+esc(b.cover)+'" alt="封面">':'')+'<h2>'+esc(b.title)+'</h2><div>'+esc([b.original_title,b.author,b.original_author,b.category,b.format,b.status].filter(Boolean).join(' · '))+'</div><p>'+esc([b.notes,b.pdf_edition].filter(Boolean).join(' · ')||'暂无笔记')+'</p>'+(b.pdf?'<a class="mini primary" target="_blank" rel="noopener" href="'+esc(b.pdf)+'">打开电子书 ↗</a> ':'')+(b.url?'<a class="mini" target="_blank" rel="noopener" href="'+esc(b.url)+'">书目 / 平台链接 ↗</a> ':'')+'<button class="mini" id="detailStar">'+(b.favorite?'★ 已收藏':'☆ 收藏')+'</button> '+(editing?'<button class="mini" id="detailEdit">编辑</button>':'');$('bookDetail').classList.remove('hidden');if($('detailStar'))$('detailStar').onclick=async()=>{if(!HongwuMaintenance.require()||saving)return;const old=b.favorite;b.favorite=!b.favorite;dirty=true;if(!await saveBooks())b.favorite=old;render();showBook(i)};if($('detailEdit'))$('detailEdit').onclick=()=>{$('bookDetail').classList.add('hidden');openEdit(i)}}
$('detailClose').onclick=()=>$('bookDetail').classList.add('hidden');$('bookDetail').onclick=e=>{if(e.target===$('bookDetail'))$('detailClose').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('bookDetail').classList.add('hidden');$('dialog').classList.add('hidden')}});
$('deleteBook').onclick=async()=>{if(editIndex<0||!confirm('删除这本图书？'))return;db.books.splice(editIndex,1);dirty=true;if(await saveBooks()){$('dialog').classList.add('hidden');buildCats();render()}};
async function saveAsset(body,target){try{const r=await fetch(endpoint('asset'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'保存失败');$(target).value=d.path;toast('已保存到 '+d.path)}catch(e){toast(e.message)}}
$('verifySource').onclick=async()=>{try{$('sourceStatus').textContent='正在读取平台页面…';const r=await fetch(endpoint('asset'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'source',url:$('fUrl').value})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message);$('sourceStatus').textContent='页面标题：'+d.title+'；请核对书名、作者与版本'}catch(e){$('sourceStatus').textContent='无法核对：'+e.message}};
$('downloadCover').onclick=()=>saveAsset({url:$('fCover').value,kind:'cover'},'fCover');
for(const [id,target,kind] of [['coverUpload','fCover','cover'],['pdfUpload','fPdf','pdf']])$(id).onchange=async()=>{const f=$(id).files[0];if(!f)return;if(f.size>25*1024*1024)return toast('文件大于 25 MB，请放入 books 目录并填写相对路径');const r=new FileReader();r.onload=()=>saveAsset({data:String(r.result).split(',')[1],mime:f.type,kind},target);r.readAsDataURL(f);$(id).value=''};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load();

HongwuMaintenance.register({app:'books',button:'#maint',section:'#bookMaintenance',sidebar:'.side-scroll',status:'/api/books/status',identity:'books',state:on=>{editing=on;syncMode();render();HongwuMaintenance.draw()},save:async()=>!dirty||await saveBooks()});
for(const id of ['add','save'])document.getElementById('bookMaintenanceActions')?.append(document.getElementById(id));
$('bookReload').onclick=load;$('bookExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='books.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('bookImport').onchange=async e=>{if(!HongwuMaintenance.require())return;try{const next=JSON.parse(await e.target.files[0].text());if(!Array.isArray(next.books))throw Error('JSON 必须包含 books 数组');const old=db;db=next;dirty=true;if(!await saveBooks()){db=old;return}buildCats();render()}catch(err){toast(err.message)}};
</script></body></html>
